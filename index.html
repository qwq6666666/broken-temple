<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>破廟宗主</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>🏚️ 破廟宗主<small class="ttl" id="ttl"></small></h1>
      <div id="resbar"></div>
      <div id="menu">
        <button class="btn mini" data-act="help" aria-label="說明" title="說明">❓<span class="bt"> 說明</span></button>
        <button class="btn mini" data-act="saveNow" aria-label="存檔" title="立即存檔">💾<span class="bt"> 存檔</span></button>
        <button class="btn mini" data-act="menuToggle" aria-label="更多" title="更多" aria-haspopup="true" aria-expanded="false">⚙️<span class="bt"> 更多</span></button>
        <div id="menuMore" hidden>
          <button class="btn mini" data-act="toggleSound">🔊 音效開</button>
          <button class="btn mini" data-act="toggleMotion">🎞 動態：開</button>
          <button class="btn mini" data-act="exportSave">📤 匯出</button>
          <button class="btn mini" data-act="importSave">📥 匯入</button>
          <button class="btn mini" data-act="resetSave">🗑 重置</button>
        </div>
      </div>
    </header>
    <div id="hint"></div>
    <main>
      <section id="left">
        <div id="scene" class="scene"></div>
        <div id="conceal" class="conceal"></div>
      </section>
      <section id="right">
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </section>
    </main>
  </div>
  <div id="banner"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
